name: fieldtest

on:
  schedule:
    - cron: "23 13 * * 3" # weekly episode, Wednesday 13:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fieldtest
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run this week's episode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run fieldtest

      # New brands appear every week. Grab their marks once; a failure here is never
      # worth blocking an episode over — the strip just falls back to a monogram.
      - name: Cache brand logos for any new sites
        continue-on-error: true
        run: npm run logos

      - name: Build the static site
        run: npm run build

      - name: Commit the episode
        run: |
          git config user.name "fieldtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fieldtest data/logos
          git diff --cached --quiet || git commit -m "chore: weekly Agent Field Test episode [skip ci]"
          git push

      - name: Prepare Firebase credentials
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase.json
        run: |
          cat > "$GOOGLE_APPLICATION_CREDENTIALS" <<'EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          EOF
          node - <<'NODE'
          const fs = require("fs");
          const path = process.env.GOOGLE_APPLICATION_CREDENTIALS;
          function normalize(raw) {
            const parsed = JSON.parse(raw.trim());
            if (typeof parsed === "string") return normalize(parsed);
            if (!parsed || typeof parsed !== "object") throw new Error("Invalid credentials JSON");
            return JSON.stringify(parsed);
          }
          const raw = fs.readFileSync(path, "utf8");
          let normalized;
          try {
            normalized = normalize(raw);
          } catch {
            normalized = normalize(Buffer.from(raw.trim(), "base64").toString("utf8"));
          }
          fs.writeFileSync(path, normalized);
          NODE

      - name: Deploy (static hosting only — no billing required)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: npx firebase-tools@13 deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Ping IndexNow
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const xml = fs.readFileSync("dist-static/sitemap.xml", "utf8");
          const urls = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => m[1]).slice(0, 2000);
          fetch("https://api.indexnow.org/indexnow", {
            method: "POST",
            headers: { "content-type": "application/json; charset=utf-8" },
            body: JSON.stringify({
              host: "agentability.org",
              key: "4e1abda486c0a02493e7b6520d2ae99b",
              keyLocation: "https://agentability.org/4e1abda486c0a02493e7b6520d2ae99b.txt",
              urlList: urls,
            }),
          }).then((r) => console.log("IndexNow:", r.status)).catch((e) => console.log("IndexNow failed (non-fatal):", e.message));
          NODE
