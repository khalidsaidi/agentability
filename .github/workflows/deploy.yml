name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm build:artifacts
      - run: pnpm -C apps/web build
      - run: pnpm check:ai
      - run: pnpm -C apps/functions build
      - name: Deploy to Firebase
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase.json
        run: |
          cat > "$GOOGLE_APPLICATION_CREDENTIALS" <<'EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          EOF

          # Normalize the secret into a real service-account JSON file.
          # Supports raw JSON, JSON-stringified JSON, or base64-encoded variants.
          node - <<'NODE'
          const fs = require("fs");
          const path = process.env.GOOGLE_APPLICATION_CREDENTIALS;
          if (!path) throw new Error("GOOGLE_APPLICATION_CREDENTIALS missing");

          function normalize(raw) {
            const trimmed = raw.trim();
            const parsed = JSON.parse(trimmed);
            if (typeof parsed === "string") return normalize(parsed);
            if (!parsed || typeof parsed !== "object") throw new Error("Invalid credentials JSON");
            return JSON.stringify(parsed);
          }

          const raw = fs.readFileSync(path, "utf8");
          let normalized;
          try {
            normalized = normalize(raw);
          } catch (error) {
            // If secrets were stored as base64, decode and try again.
            const decoded = Buffer.from(raw.trim(), "base64").toString("utf8");
            normalized = normalize(decoded);
          }

          fs.writeFileSync(path, normalized, "utf8");

          const creds = JSON.parse(normalized);
          console.log(`Using service account for project_id=${creds.project_id} (${creds.client_email})`);
          NODE

          # Deploy hosting first so UI updates can ship even if functions deploy is blocked by IAM.
          pnpm dlx firebase-tools deploy --project "$FIREBASE_PROJECT_ID" --only hosting --non-interactive
          pnpm dlx firebase-tools deploy --project "$FIREBASE_PROJECT_ID" --only functions --non-interactive --force

      - name: Verify public freshness after deploy
        run: |
          set -euo pipefail
          for path in /stats.json /discovery/audit/latest.json; do
            body="$(curl -sS "https://agentability.org${path}?cb=$(date +%s)")"
            generated_at="$(echo "$body" | jq -r '.generated_at // empty')"
            if [[ -z "$generated_at" ]]; then
              echo "::error::${path} missing generated_at"
              exit 1
            fi
            now_epoch="$(date -u +%s)"
            gen_epoch="$(date -u -d "$generated_at" +%s)"
            age="$((now_epoch - gen_epoch))"
            echo "path=${path} generated_at=${generated_at} age_seconds=${age}"
            if [[ "$age" -gt 86400 ]]; then
              echo "::error::${path} stale after deploy (${age}s)"
              exit 1
            fi
          done
