name: publish-npm

# Publishes the `agentability` CLI (cli/) to npm with trusted publishing (OIDC),
# the same way the other @khalidsaidi packages ship: no token, run by hand.
# Bump cli/package.json's version, push, then run this workflow.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version
      - name: Smoke test against the live API
        run: node bin.js --help && NO_COLOR=1 node bin.js example.com --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);if(typeof r.score!=='number'){console.error(s);process.exit(1)}console.log('score',r.score)})"
      - name: Publish (npm trusted publishing / OIDC)
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "agentability@$version" version >/dev/null 2>&1; then
            echo "$version is already on npm"
          else
            npm publish --access public
          fi
