name: ai-index

on:
  schedule:
    - cron: "23 6 * * 1" # weekly, Monday 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-index
  cancel-in-progress: false

jobs:
  audit-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run the AI-Readiness Index
        env:
          INDEX_CONCURRENCY: "6"
        run: npm run index

      - name: Build the static site
        run: npm run build

      - name: Commit refreshed data
        run: |
          git config user.name "ai-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/index
          git diff --cached --quiet || git commit -m "chore: weekly AI-Readiness Index refresh [skip ci]"
          git push

      - name: Prepare Firebase credentials
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase.json
        run: |
          cat > "$GOOGLE_APPLICATION_CREDENTIALS" <<'EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          EOF
          node - <<'NODE'
          const fs = require("fs");
          const path = process.env.GOOGLE_APPLICATION_CREDENTIALS;
          function normalize(raw) {
            const parsed = JSON.parse(raw.trim());
            if (typeof parsed === "string") return normalize(parsed);
            if (!parsed || typeof parsed !== "object") throw new Error("Invalid credentials JSON");
            return JSON.stringify(parsed);
          }
          const raw = fs.readFileSync(path, "utf8");
          let normalized;
          try {
            normalized = normalize(raw);
          } catch {
            normalized = normalize(Buffer.from(raw.trim(), "base64").toString("utf8"));
          }
          fs.writeFileSync(path, normalized);
          NODE

      - name: Deploy (static hosting only — no billing required)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: npx firebase-tools@13 deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
