name: self-audit-daily

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Trigger self evaluation
        id: trigger
        run: |
          set -euo pipefail
          body="$(curl -sS -X POST 'https://agentability.org/v1/evaluate' \
            -H 'Content-Type: application/json' \
            --data '{"origin":"https://agentability.org","profile":"auto"}')"
          echo "$body" | jq .
          run_id="$(echo "$body" | jq -r '.runId // empty')"
          if [ -z "$run_id" ]; then
            echo "missing runId"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Poll run completion
        run: |
          set -euo pipefail
          run_id='${{ steps.trigger.outputs.run_id }}'
          for _ in $(seq 1 80); do
            body="$(curl -sS "https://agentability.org/v1/runs/${run_id}")"
            status="$(echo "$body" | jq -r '.status // empty')"
            echo "status=${status}"
            if [ "$status" = "complete" ]; then
              exit 0
            fi
            if [ "$status" = "failed" ]; then
              echo "$body" | jq .
              exit 1
            fi
            sleep 3
          done
          echo "self-audit run did not complete in time"
          exit 1

      - name: Verify latest evaluation freshness
        run: |
          set -euo pipefail
          body="$(curl -sS 'https://agentability.org/v1/evaluations/agentability.org/latest.json')"
          echo "$body" | jq .
          completed_at="$(echo "$body" | jq -r '.completedAt // empty')"
          if [ -z "$completed_at" ]; then
            echo "missing completedAt"
            exit 1
          fi
          now_epoch="$(date -u +%s)"
          completed_epoch="$(date -u -d "$completed_at" +%s)"
          age="$((now_epoch - completed_epoch))"
          if [ "$age" -gt 86400 ]; then
            echo "latest evaluation is stale: ${age}s"
            exit 1
          fi

      - name: Refresh hosting artifacts
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase.json
        run: |
          set -euo pipefail
          cat > "$GOOGLE_APPLICATION_CREDENTIALS" <<'EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          EOF

          node - <<'NODE'
          const fs = require("fs");
          const path = process.env.GOOGLE_APPLICATION_CREDENTIALS;
          if (!path) throw new Error("GOOGLE_APPLICATION_CREDENTIALS missing");

          function normalize(raw) {
            const trimmed = raw.trim();
            const parsed = JSON.parse(trimmed);
            if (typeof parsed === "string") return normalize(parsed);
            if (!parsed || typeof parsed !== "object") throw new Error("Invalid credentials JSON");
            return JSON.stringify(parsed);
          }

          const raw = fs.readFileSync(path, "utf8");
          let normalized;
          try {
            normalized = normalize(raw);
          } catch (error) {
            const decoded = Buffer.from(raw.trim(), "base64").toString("utf8");
            normalized = normalize(decoded);
          }

          fs.writeFileSync(path, normalized, "utf8");
          NODE

          pnpm build:artifacts
          pnpm -C apps/web build
          pnpm build:ssr-assets
          pnpm dlx firebase-tools deploy --project "$FIREBASE_PROJECT_ID" --only hosting --non-interactive

      - name: Verify public stats freshness
        run: |
          set -euo pipefail
          body="$(curl -sS 'https://agentability.org/stats.json?cb='"$(date +%s)")"
          echo "$body" | jq .
          generated_at="$(echo "$body" | jq -r '.generated_at // empty')"
          if [ -z "$generated_at" ]; then
            echo "missing generated_at"
            exit 1
          fi
          now_epoch="$(date -u +%s)"
          gen_epoch="$(date -u -d "$generated_at" +%s)"
          age="$((now_epoch - gen_epoch))"
          if [ "$age" -gt 86400 ]; then
            echo "stats.json is stale: ${age}s"
            exit 1
          fi

      - name: Verify discovery latest freshness
        run: |
          set -euo pipefail
          body="$(curl -sS 'https://agentability.org/discovery/audit/latest.json?cb='"$(date +%s)")"
          echo "$body" | jq '{generated_at, live_checked_at, discoverability_health}'
          generated_at="$(echo "$body" | jq -r '.generated_at // empty')"
          if [ -z "$generated_at" ]; then
            echo "missing generated_at"
            exit 1
          fi
          now_epoch="$(date -u +%s)"
          gen_epoch="$(date -u -d "$generated_at" +%s)"
          age="$((now_epoch - gen_epoch))"
          if [ "$age" -gt 86400 ]; then
            echo "discovery latest.json is stale: ${age}s"
            exit 1
          fi
