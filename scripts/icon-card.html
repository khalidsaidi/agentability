<!doctype html>
<!-- The site icon: the brand's yellow tile with a lowercase "a". Rendered to
     PNG by scripts/render-icons.sh at each size the site and the MCP
     directories ask for. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; background: transparent; overflow: hidden; }
  .tile { position: absolute; inset: 0; background: #ffd23f; border-radius: 22%; display: flex; align-items: center; justify-content: center; }
  .a { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; color: #111; font-size: 78vh; line-height: 1; transform: translateY(-6%); letter-spacing: -0.04em; }
</style></head>
<body><div class="tile"><span class="a">a</span></div></body></html>
