<!doctype html>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Spline+Sans+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#0f1014;overflow:hidden}
  .card{position:relative;width:1200px;height:630px;padding:64px 72px;box-sizing:border-box;font-family:"Bricolage Grotesque",sans-serif;color:#f2f1ea}
  .brand{font-weight:800;font-size:34px;letter-spacing:-.01em}
  .brand span{background:#ffd028;color:#111;padding:0 10px;border-radius:8px;margin-left:2px}
  h1{font-weight:800;font-size:72px;line-height:.98;letter-spacing:-.03em;margin:40px 0 0;max-width:1000px}
  .hl{background:#ffd028;color:#111;padding:0 .12em;border-radius:.1em;display:inline-block;transform:rotate(-1deg)}
  .strip{position:absolute;left:72px;right:72px;bottom:64px;display:flex;gap:8px}
  .strip i{flex:1;height:44px;border-radius:9px;background:#46e094}
  .strip i.y{background:#ffd028}.strip i.r{background:#ff6058}
  .rule{position:absolute;left:72px;bottom:130px;font-family:"Spline Sans Mono",monospace;font-weight:600;font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:#9a9daf}
  .rule b{color:#ffd028}
</style>
<div class="card">
  <div class="brand">agent<span>ability</span></div>
  <h1>We send an AI agent to run your <span class="hl">errands</span> on the real web. Then we publish <span class="hl">everything</span>.</h1>
  <div class="rule">weekly · fully autonomous · <b>no retries · no editing · no mercy</b></div>
  <div class="strip"><i></i><i class="y"></i><i></i><i></i><i class="y"></i><i></i><i class="r"></i><i class="y"></i><i></i><i></i></div>
</div>
